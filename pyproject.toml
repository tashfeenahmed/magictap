[project]
name = "magictap"
version = "0.2.0"
description = "Touch input for a laptop screen with no touchscreen: your eyes pick the button, the tap sound says when."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "mediapipe>=1.1.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "websockets>=17.2",
]

[project.scripts]
magictap = "magictap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["magictap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
